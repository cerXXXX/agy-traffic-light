[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-traffic-light"
version = "1.0.0"
description = "Antigravity AI Agent traffic light status indicator for Waybar, DMS, and System Tray"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Community Contributor" }
]
keywords = ["antigravity", "ai", "waybar", "niri", "status-indicator", "appindicator", "macos", "windows", "tray"]
dependencies = [
    "psutil>=5.9.0",
    "pystray>=0.19.5",
    "Pillow>=9.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X"
]

[project.scripts]
agy-traffic-daemon = "agy_traffic_light.daemon:main"
agy-traffic-tray = "agy_traffic_light.tray:run_pystray_app"
agy-traffic-uninstall = "agy_traffic_light.uninstall:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agy_traffic_light*"]
